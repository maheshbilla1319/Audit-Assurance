<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="AuditAssure - 404 Page Not Found"
    >

    <title>404 | AuditAssure</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- 404 CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">

        <span class="dot dot-1"></span>
        <span class="dot dot-2"></span>
        <span class="dot dot-3"></span>
        <span class="dot dot-4"></span>
        <span class="dot dot-5"></span>
        <span class="dot dot-6"></span>

        <span class="square square-1"></span>
        <span class="square square-2"></span>
        <span class="square square-3"></span>

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>


    <!-- Main 404 -->
    <main class="error-page">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </span>

            <span>
                
        STACKLY <span>Assure</span>
            </span>
        </a>


        <!-- Error Card -->
        <section class="error-card">

            <div class="card-line"></div>

            <div class="error-icon">
                <i class="fa-solid fa-file-circle-exclamation"></i>
            </div>

            <p class="error-label">
                ERROR 404
            </p>

            <h1>
                Page <span>Not Found</span>
            </h1>

            <p class="error-text">
                The page you're looking for may have been moved,
                deleted, or is temporarily unavailable.
            </p>


            <!-- Big 404 -->
            <div class="error-number">

                <span class="four">4</span>

                <div class="zero">
                    <div class="zero-inner">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>

                <span class="four">4</span>

            </div>


            <!-- Buttons -->
            <div class="error-actions">

                <a href="index.html" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i>
                    Back to Home
                </a>

                <button
                    type="button"
                    class="btn btn-outline"
                    id="goBackBtn"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Go Back
                </button>

            </div>


            <!-- Help -->
            <div class="help-text">
                <span class="help-icon">
                    <i class="fa-solid fa-circle-info"></i>
                </span>

                <span>
                    Need assistance?
                    <a href="contact.html">Contact our team</a>
                </span>
            </div>

        </section>


        <!-- Footer -->
        <footer class="error-footer">

            <p>
                © <span id="year"></span>
                AuditAssure. All Rights Reserved.
            </p>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </div>

        </footer>

    </main>


    <!-- JavaScript -->
    <script src="./javascript/404.js"></script>

</body>
</html>
